[workspace]
resolver = "2"
# The library (`catp`) is this manifest's own `[package]`, below -- a
# workspace root can be a member in its own right, so it doesn't need listing
# here. That's deliberate: keeping `catp`'s `Cargo.toml` at the repo root
# (rather than moving it into its own subdirectory) means `docs/`, `tests/`,
# `benches/`, `examples/`, and `fuzz/`'s existing relative paths and `../`
# references keep working unchanged (issue #74).
members = ["tools"]
# `fuzz/` has its own `Cargo.toml` and its own committed `Cargo.lock`,
# deliberately kept independent of this workspace's lockfile (see
# `fuzz/README.md`) -- it depends on `catp` the same way any external
# consumer would, via a plain path dependency, not workspace membership.
# Cargo refuses to build a nested `Cargo.toml` it finds under a workspace
# root unless that package is either a member or explicitly excluded; this
# is the exclusion.
exclude = ["fuzz"]

[package]
name = "catp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Compact Authenticated Telemetry Protocol: authenticated, connectionless telemetry over UDP"
repository = "https://github.com/i3iorn/catp"
readme = "README.md"
keywords = ["telemetry", "iot", "udp", "protocol", "hmac"]
categories = ["network-programming", "embedded"]
# 0.1.0 tracks the crate's own API, not the wire protocol's version (still v1
# draft per PROTOCOL.md 14.3 -- see #38). The two are not the same axis: a
# wire-format change is a protocol-version event, a Rust API change is a
# crate-version event, and they will not always coincide.
#
# Not yet published to crates.io: publishing claims the name and makes the API
# a commitment, and that is a decision for the maintainer to make deliberately
# rather than as a side effect of adding this metadata (see #38).

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
# Default on so nothing downstream breaks. Without it, the crate is
# `#![no_std]` + `alloc`: the codec, key schedule, replay window, and
# pacer need no more than that (see issue #37's survey). `std` adds
# `Collector`, the multi-peer host-side registry, and `catp::provisioning`
# (file I/O), neither of which a constrained node ever needs.
default = ["std"]
std = []

[dependencies]
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
hkdf = "0.13"
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }
siphasher = { version = "1.0.3", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "codec"
harness = false
