[package]
name = "catp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Compact Authenticated Telemetry Protocol: authenticated, connectionless telemetry over UDP"
repository = "https://github.com/i3iorn/catp"
readme = "README.md"
keywords = ["telemetry", "iot", "udp", "protocol", "hmac"]
categories = ["network-programming", "embedded"]
# 0.1.0 tracks the crate's own API, not the wire protocol's version (still v1
# draft per PROTOCOL.md 14.3 -- see #38). The two are not the same axis: a
# wire-format change is a protocol-version event, a Rust API change is a
# crate-version event, and they will not always coincide.
#
# Not yet published to crates.io: publishing claims the name and makes the API
# a commitment, and that is a decision for the maintainer to make deliberately
# rather than as a side effect of adding this metadata (see #38).

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
# Default on so nothing downstream breaks. Without it, the crate is
# `#![no_std]` + `alloc`: the codec, key schedule, replay window, and
# pacer need no more than that (see issue #37's survey). `std` adds
# `Collector`, the multi-peer host-side registry, and `catp::provisioning`
# (file I/O), neither of which a constrained node ever needs.
default = ["std", "getrandom"]
std = []
# Toggles the optional `getrandom` dependency. Nothing in the *library*
# uses it -- only `catp-provision` (its CSPRNG for a fresh `sender_id`/
# `device_secret`) does. It's still a real dependency of this package's
# Cargo.toml, though, and Cargo resolves a package's dependency graph as a
# whole regardless of which target is being built: `cargo build --lib`
# alone does not skip a dependency only a `[[bin]]` uses. Left non-optional,
# `getrandom` broke `cargo build --lib --no-default-features` for a
# bare-metal target outright (no backend exists there for it, by design --
# see its own docs on custom backends). Making it optional, and off by
# default only when `std` is also off, is the fix until #74 moves the
# binaries into their own package and this stops being a shared-manifest
# problem at all.
getrandom = ["dep:getrandom"]

[dependencies]
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
hkdf = "0.13"
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }
siphasher = { version = "1.0.3", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4.3", optional = true }

[[bin]]
name = "catp-sender"
path = "src/bin/sender.rs"

[[bin]]
name = "catp-collector"
path = "src/bin/collector.rs"

[[bin]]
name = "catp-vectors"
path = "src/bin/vectors.rs"

[[bin]]
name = "catp-provision"
path = "src/bin/provision.rs"

[[bin]]
name = "catp-conformance-iut"
path = "src/bin/conformance_iut.rs"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "codec"
harness = false
