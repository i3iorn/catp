[package]
name = "catp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Compact Authenticated Telemetry Protocol: authenticated, connectionless telemetry over UDP"
repository = "https://github.com/i3iorn/catp"

[dependencies]
hmac = "0.13"
sha2 = "0.11"
hkdf = "0.13"
zeroize = { version = "1", features = ["derive"] }

[[bin]]
name = "catp-sender"
path = "src/bin/sender.rs"

[[bin]]
name = "catp-collector"
path = "src/bin/collector.rs"

[[bin]]
name = "catp-vectors"
path = "src/bin/vectors.rs"
